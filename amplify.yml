# AWS Amplify Hosting build settings for the Meridian Next.js app.
# Amplify auto-detects Next.js (App Router) and provisions SSR compute for the
# route handlers + proxy.
#
# ── Environment variables ──────────────────────────────────────────────────
# Set these in the Amplify console (App settings → Environment variables) for
# each branch. The preBuild step writes the PUBLIC (NEXT_PUBLIC_*) ones into
# .env.production so Next.js inlines them at build time.
#
#   NEXT_PUBLIC_AWS_REGION                  e.g. us-east-2
#   NEXT_PUBLIC_COGNITO_USER_POOL_ID
#   NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID
#   NEXT_PUBLIC_AWS_DYNAMODB_TABLE_NAME     e.g. meridian-dev
#   NEXT_PUBLIC_AWS_S3_BUCKET
#
# ── Credentials (server-only) ───────────────────────────────────────────────
# IMPORTANT: Amplify reserves the "AWS_" prefix, so you CANNOT set
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the Amplify console.
#
#   RECOMMENDED: attach an IAM role with scoped DynamoDB/S3/Cognito permissions
#   to the app's compute. The SDK picks it up automatically — set no keys.
#
#   ALTERNATIVE (static keys): set non-reserved vars and the app passes them
#   to the SDK explicitly:
#     MERIDIAN_AWS_ACCESS_KEY_ID
#     MERIDIAN_AWS_SECRET_ACCESS_KEY
#     MERIDIAN_AWS_SESSION_TOKEN   (optional, for temporary credentials)
#
# Locally (.env.local) the standard AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# still work — the SDK's default chain reads them automatically.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Make public config available to the build (values come from the
        # Amplify console env). Secret AWS_* keys are deliberately excluded.
        - |
          {
            echo "NEXT_PUBLIC_AWS_REGION=$NEXT_PUBLIC_AWS_REGION"
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID"
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID"
            echo "NEXT_PUBLIC_AWS_DYNAMODB_TABLE_NAME=$NEXT_PUBLIC_AWS_DYNAMODB_TABLE_NAME"
            echo "NEXT_PUBLIC_AWS_S3_BUCKET=$NEXT_PUBLIC_AWS_S3_BUCKET"
          } >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
